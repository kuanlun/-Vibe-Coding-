<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盲盒表单</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="admin-header">
        <div class="header-content">
            <h1>盲盒管理后台</h1>
            <nav class="admin-nav">
                <a href="/admin" class="nav-link">首页</a>
                <a href="/admin/boxes" class="nav-link">管理盲盒列表</a>
                <a href="/admin/boxes/new" class="nav-link">添加新盲盒</a>
                <form id="logout-form" class="logout-form">
                    <button type="submit" class="btn-logout">登出</button>
                </form>
            </nav>
        </div>
    </header>
    <main>
        <section class="form-section">
            <h2 id="form-title">添加新盲盒</h2>
            <form id="box-form">
                <input type="hidden" id="box-id" value="{{ box.id if box else '' }}">
                <div class="form-group">
                    <label for="name">名称 *</label>
                    <input type="text" id="name" name="name" required value="{{ box.name if box else '' }}" placeholder="请输入盲盒名称">
                </div>
                <div class="form-group">
                    <label for="description">描述</label>
                    <textarea id="description" name="description" placeholder="请输入盲盒描述">{{ box.description if box else '' }}</textarea>
                </div>
                <div class="form-group">
                    <label for="price">价格</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" value="{{ box.price if box else '0' }}" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="image-upload">上传图片</label>
                    <input type="file" id="image-upload" name="file" accept="image/*" class="file-input">
                    <div id="upload-result" class="upload-result"></div>
                </div>
                <div class="form-group">
                    <label for="image_path">图片路径</label>
                    <input type="text" id="image_path" name="image_path" value="{{ box.image_path if box else '' }}" readonly placeholder="上传图片后自动填充">
                    <div id="image-preview" class="image-preview">
                        {% if box and box.image_path %}
                        <img src="{{ box.image_path }}" alt="当前图片" class="preview-img">
                        {% endif %}
                    </div>
                </div>
                <div class="form-group">
                    <label for="is_secret" class="checkbox-label">
                        <input type="checkbox" id="is_secret" name="is_secret" {{ 'checked' if box and box.is_secret else '' }}>
                        隐藏内容（仅管理员可见）
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn-save">保存</button>
                    <a href="/admin/boxes" class="btn-cancel">取消</a>
                </div>
            </form>
        </section>
    </main>
    <footer class="admin-footer">
        <p>&copy; 2024 盲盒展示平台. All rights reserved.</p>
    </footer>
    <script>
        const isEdit = {{ 'true' if box else 'false' }};
        const boxId = {{ box.id if box else 'null' }};
        document.getElementById('form-title').textContent = isEdit ? '编辑盲盒' : '添加新盲盒';

        // Check session
        (async function checkSession() {
            try {
                const response = await fetch('/api/admin/check', { credentials: 'include' });
                if (!response.ok) {
                    window.location.href = '/admin/login';
                }
            } catch (err) {
                window.location.href = '/admin/login';
            }
        })();

        // Image upload handler
        document.getElementById('image-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const uploadResult = document.getElementById('upload-result');
            const imagePreview = document.getElementById('image-preview');
            uploadResult.textContent = '上传中...';
            uploadResult.className = 'upload-result uploading';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                const data = await response.json();

                if (data.image_path) {
                    document.getElementById('image_path').value = data.image_path;
                    uploadResult.textContent = '上传成功';
                    uploadResult.className = 'upload-result success';

                    // Show image preview
                    imagePreview.innerHTML = `<img src="${data.image_path}" alt="预览" class="preview-img">`;
                } else {
                    uploadResult.textContent = data.error || '上传失败';
                    uploadResult.className = 'upload-result error';
                }
            } catch (err) {
                uploadResult.textContent = '上传失败，请稍后重试';
                uploadResult.className = 'upload-result error';
            }
        });

        // Form submission
        document.getElementById('box-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            if (!name) {
                alert('请输入盲盒名称');
                return;
            }

            const data = {
                name: name,
                description: document.getElementById('description').value.trim(),
                price: parseFloat(document.getElementById('price').value) || 0,
                image_path: document.getElementById('image_path').value,
                is_secret: document.getElementById('is_secret').checked
            };

            const url = isEdit ? `/api/boxes/${boxId}` : '/api/boxes';
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.box || result.success) {
                    window.location.href = '/admin/boxes';
                } else {
                    alert('保存失败：' + (result.error || '未知错误'));
                }
            } catch (err) {
                alert('网络错误，请稍后重试');
            }
        });

        // Logout handler
        document.getElementById('logout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!confirm('确定要退出登录吗？')) return;
            try {
                const response = await fetch('/api/admin/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                if (response.ok) {
                    window.location.href = '/admin/login';
                }
            } catch (err) {
                window.location.href = '/admin/login';
            }
        });
    </script>
</body>
</html>

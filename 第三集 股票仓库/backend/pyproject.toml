[build-system]
requires = ["setuptools>=61.0"]

[project]
name = "stock-portfolio-manager"
version = "1.0.0"
description = "Stock Portfolio Manager - Multi-market stock monitoring platform"
requires-python = ">=3.10"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]